name: Check PHP syntax

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  phptest:
    name: Check PHP syntax
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up PHP for PocketMine-MP
        uses: pmmp/setup-php-action@e031917a35223b96cba12fe19ace0765c91f6bfb
        with:
          php-version: 8.2
          pm-version-major: 5

      - name: Install Composer dependencies
        run: composer install --prefer-dist

      - name: Check PHP source and build tool syntax
        run: find src tools -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
