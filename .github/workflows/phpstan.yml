name: Analyze PHP code with PHPStan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  phpstan:
    name: Run PHPStan at maximum level
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up PHP for PocketMine-MP
        uses: pmmp/setup-php-action@e031917a35223b96cba12fe19ace0765c91f6bfb
        with:
          php-version: 8.2
          pm-version-major: 5

      - name: Install Composer dependencies
        run: composer install --prefer-dist

      - name: Run PHPStan at maximum level
        run: composer run-script analyze
