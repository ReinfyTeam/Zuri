name: Build and validate plugin

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and validate plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP for PocketMine-MP
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: 8.2
          pm-version-major: 5
      
      - name: Install Composer dependencies
        run: composer install --prefer-dist
      
      - name: Build plugin PHAR
        run: composer run-script build

      - name: Test plugin lifecycle and metrics on PocketMine-MP
        run: |
          curl --fail --location --retry 3 --output build/PocketMine-MP.phar https://github.com/pmmp/PocketMine-MP/releases/download/5.44.3/PocketMine-MP.phar
          composer test:runtime -- build/PocketMine-MP.phar

      - name: Upload plugin PHAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: Zuri
          path: build/Zuri.phar
          if-no-files-found: error
