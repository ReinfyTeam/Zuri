name: Build and validate Zuri plugin

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and validate Zuri plugin
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Set up PHP for PocketMine-MP
        uses: pmmp/setup-php-action@e031917a35223b96cba12fe19ace0765c91f6bfb
        with:
          php-version: 8.2
          pm-version-major: 5
      
      - name: Install Composer dependencies
        run: composer install --prefer-dist
      
      - name: Build plugin PHAR
        run: composer run-script build

      - name: Upload plugin PHAR artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Zuri
          path: build/Zuri.phar
          if-no-files-found: error
