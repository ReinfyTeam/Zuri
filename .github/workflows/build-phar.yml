name: Build and validate plugin

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and validate plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP for PocketMine-MP
        uses: pmmp/setup-php-action@3c38c259834f945351a662392836d90eb08abff0
        with:
          php-version: 8.2
          pm-version-major: 5
      
      - name: Install Composer dependencies
        run: composer install --prefer-dist
      
      - name: Build plugin PHAR
        run: composer run-script build

      - name: Test plugin lifecycle and metrics on Axolotl-PM
        run: |
          curl --fail --location --retry 3 --output build/PocketMine-MP.phar https://github.com/axolotl-pm/PocketMine-MP/releases/download/5.49.1/PocketMine-MP.phar
          composer test:runtime -- build/PocketMine-MP.phar

      - name: Upload plugin PHAR artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Zuri
          path: build/Zuri.phar
          if-no-files-found: error
