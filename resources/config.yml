zuri:
  config_version: 0.4.5
  # Language of the Plugin for messages
  # You can customize messages on plugin_data/Zuri/lang/*.yml for language
  language:
    prefix: "&7(&e&lZuri&r&7) &8>&r"
    selected: en_US
    fallback: en_US
  # Threaded processing settings
  # Adjust these values based on your server's performance and workload.
  threads:
    # Number of threads to spawn for check processing. Default: 2.
    count: 2
    # Number of check workers managed by each thread.
    max_worker: 4
    # Maximum queued checks accepted by each worker.
    worker_capacity: 64
  # Metrics settings: This helps to monitor the performance of the anticheat system and can be used for debugging or optimization.
  # Adjust the delay for metrics collection based on your server's performance and workload.
  metrics:
    # Delay between metrics updates in seconds (minimum 1). Default: 3.
    delay: 3
  results_handler:
    # Delay between results handling task in seconds (minimum 0.1). Default: 0.5.
    delay: 0.5
  # Punishment thresholds: Responsible for handling considerations of the player conditions.
  # This involves the ping, server tps, server load that affects modules.
  thresholds:
    default-multiplier: 1.0
    # Adjust ping sensitivity
    ping:
      # Default sensitivity
      default: 1.0
      # Per module sensitivity (if you want to adjust based on module)
      # Ex. Movement checks are more sensitive to ping
      speed: 1.5
      fly: 1.5
      reach: 1.3
      timer: 1.2
    tps:
      # Default sensitivity
      default: 1.0
      # Per module sensitivity (if you want to adjust based on module)
      # Ex. Packet and combat checks are more sensitive to tps
      timer: 2.0
      speed: 1.5
      killaura: 1.2
      reach: 1.2
  punishments:
    ban:
      # The command to execute when a player is banned.
      # Use {player} as a placeholder for the player's name.
      # Available types: [native, command] (if none specified, defaults to command)
      # If you choose "native", the plugin will use the server's built-in ban system.
      # If you choose "command", you can specify a custom command to execute.
      type: command
      # To customize ban messages, please see language files to edit manually.
      command: "ban {player} Unfair Advantage"
      # Ban Message for native bans. This is ignored if using a command-based ban.
      message: "Unfair Advantage"
      # Duration of ban if using the native ban system.
      # Use a format like "30d" for 30 days, "12h" for 12 hours, or "permanent" if permantent bans are allowed.
      # This is ignored if using a command-based ban.
      duration: "30d"
    kick:
      # The command to execute when a player is kicked.
      # Use {player} as a placeholder for the player's name.
      # Available types: [native, command] (if none specified, defaults to command)
      # If you choose "native", the plugin will use the server's built-in kick system.
      # If you choose "command", you can specify a custom command to execute.
      type: command
      # To customize kick messages, please see language files to edit manually.
      command: "kick {player} Unfair Advantage"
    # Violation decay time in seconds. This determines how quickly violation points decrease over time.
    violation_decay_time: 5
  permissions:
    command: zuri.command
    bypass: zuri.bypass
    alerts: zuri.alerts
  world_bypass:
    mode: blacklist
    list: ["world", "hub", "lobby"]
  alerts:
    pre_violations: true
    violations: true
  checks:
    # Enable or disable specific checks. You can also configure their sensitivity and punishment settings.
    speed:
      enabled: true
      pre_vl: 2
      max_vl: 2
      punishment: kick
    reach:
      enabled: true
      pre_vl: 2
      max_vl: 2
      punishment: kick
    hitbox:
      enabled: true
      pre_vl: 2
      max_vl: 2
      punishment: kick